[package]
name = "parasight"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.3"
toml = "1.2.1"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
